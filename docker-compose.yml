version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tokoindo-db
    environment:
      POSTGRES_USER: tokoindo
      POSTGRES_PASSWORD: tokoindo123
      POSTGRES_DB: tokoindo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokoindo -d tokoindo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
